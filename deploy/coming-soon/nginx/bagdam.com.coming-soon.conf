# =============================================================================
# Bağdam — GEÇİCİ apex vhost: bagdam.com (+ www → apex 301) — statik coming-soon sayfası
#
#   Sunucu: /etc/nginx/sites-available/bagdam.com.conf  (+ sites-enabled symlink)
#   Kök:    /var/www/bagdam-comingsoon  (deploy/coming-soon/publish.sh ile yüklenir)
#   SSL:    Let's Encrypt (certbot webroot /var/www/letsencrypt, renew_hook: systemctl reload nginx)
#           + Cloudflare proxy (Full strict, Always Use HTTPS). F1'de Origin CA'ya geçilebilir.
#   Yerini alacak: deploy/nginx/bagdam.com.conf (PM2 bagdam-api :5010) — F1 sunucu kurulumu bitince
#   bu dosya silinir; /var/www/bagdam-comingsoon yedek olarak kalabilir.
#   Ön koşul: /etc/nginx/snippets/bagdam-security-headers.conf (deploy/nginx/snippets/)
# =============================================================================

# --- 80 → https apex (ACME hariç) -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bagdam.com www.bagdam.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://bagdam.com$request_uri; }
}

# --- https www → apex ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bagdam.com;

    ssl_certificate     /etc/letsencrypt/live/bagdam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagdam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://bagdam.com$request_uri; }
}

# --- https apex: statik coming-soon ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bagdam.com;

    ssl_certificate     /etc/letsencrypt/live/bagdam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagdam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bagdam_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bagdam.access.log;
    error_log  /var/log/nginx/bagdam.error.log;

    root /var/www/bagdam-comingsoon;
    index index.html;
    charset utf-8;

    include snippets/bagdam-security-headers.conf;
    add_header X-Frame-Options SAMEORIGIN always;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Gizli dosyalar asla
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # Anasayfa: 200, önbelleksiz (içerik değişince anında görünsün)
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        include snippets/bagdam-security-headers.conf;
    }
    location = /index.html { return 301 /; }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600" always; }
    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # styles.css — statik kopya; 1 saat (sürüm parametresi yok)
    location = /styles.css {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/bagdam-security-headers.conf;
    }

    # Görsel / logo / ikon — 30 gün
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # Diğer her yol: anasayfaya geçici yönlendirme (henüz indekslenmiş URL yok)
    location / { return 302 /; }
}
