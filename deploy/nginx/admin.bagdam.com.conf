# =============================================================================
# Bağdam — admin paneli vhost: admin.bagdam.com (React SPA statik + /api/ → :5010)
#
#   Kopyala: /etc/nginx/sites-available/admin.bagdam.com.conf
#            ln -s /etc/nginx/sites-available/admin.bagdam.com.conf /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#   Ön koşullar: snippets/bagdam-*.conf, conf.d/01-rate-limits.conf, /etc/ssl/bagdam/origin.{pem,key},
#                /opt/bagdam/apps/admin/dist (deploy.sh üretir; ilk deploy'dan önce 404 vermesi normal)
#   Notlar:
#     - Admin ve API aynı origin (same-origin cookie; ADR-0009: access_token path=/, CSRF double-submit).
#     - X-Frame-Options DENY (clickjacking), X-Robots-Tag noindex — admin aranmaz.
#     - Vite çıktısı /assets/*.<hash>.* → 1 yıl immutable; index.html no-cache.
#     - Cloudflare'de admin için ayrıca Access/WAF kuralı eklenebilir (ops, isteğe bağlı).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.bagdam.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.bagdam.com;

    ssl_certificate     /etc/ssl/bagdam/origin.pem;
    ssl_certificate_key /etc/ssl/bagdam/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bagdam_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bagdam-admin.access.log;
    error_log  /var/log/nginx/bagdam-admin.error.log;

    root /opt/bagdam/apps/admin/dist;
    index index.html;

    client_max_body_size 20M;          # medya yükleme (F4)
    limit_req_status 429;

    include snippets/bagdam-security-headers.conf;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # API bakım yanıtı (JSON)
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"error":"Service Unavailable","message":"Kısa bir bakımdayız, lütfen tekrar deneyin."}';
    }

    # --- API (aynı origin) -----------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;
    }

    # Yüklenen medya ön izlemesi (Medya ekranı) — nginx'ten doğrudan
    location /uploads/ {
        alias /opt/bagdam/apps/api/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Frame-Options DENY always;
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # --- SPA statik ------------------------------------------------------------------------
    # Vite hash'li çıktılar — 1 yıl immutable
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # index.html her zaman taze (yeni deploy'da hash'li asset adları değişir)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/bagdam-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
