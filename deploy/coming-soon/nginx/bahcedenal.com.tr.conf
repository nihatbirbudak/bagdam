# Bahceden Al -> Bagdam: Coming Soon (gecici, marka gecis donemi)  — 2026-08-20 surumu
# Sunucu: /etc/nginx/sites-available/bahcedenal.com.tr  (onceki surum: .bak-20260820)
# Cloudflare arkasinda calisir (proxied). SSL: Let's Encrypt (certbot webroot) + CF Full (strict).
# Icerik: /var/www/bahcedenal-comingsoon = Bagdam coming-soon sayfasinin "artik Bagdam" notlu surumu
#         (kaynak: www.bagdam.com repo deploy/coming-soon/bahcedenal.com.tr/ + publish.sh).
# SEO stratejisi: anasayfa 200, tum eski derin URL'ler 302 -> / (gecici sinyal, link equity korunur).
# SONRAKI ADIM (kullanici karari): bahcedenal.com.tr -> https://bagdam.com 301 (asagidaki "YONLENDIRME" blogu).

server {
    listen 80;
    listen [::]:80;
    server_name bahcedenal.com.tr www.bahcedenal.com.tr;

    # Let's Encrypt HTTP-01 dogrulamasi
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bahcedenal.com.tr www.bahcedenal.com.tr;

    ssl_certificate     /etc/letsencrypt/live/bahcedenal.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bahcedenal.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/bahcedenal-comingsoon;
    index index.html;
    charset utf-8;

    # ACME dogrulamasi 443'te de gerekli (Cloudflare "Always Use HTTPS" HTTP-01'i buraya yonlendirir)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # --- Anasayfa: 200 (index'te kalsin, noindex YOK) ---
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Statik dosyalar ---
    location = /robots.txt  { }
    location = /sitemap.xml { }
    location = /favicon.ico { add_header Cache-Control "public, max-age=86400"; }
    location = /favicon.png { add_header Cache-Control "public, max-age=86400"; }
    location = /logo.png    { add_header Cache-Control "public, max-age=86400"; }
    location = /og-image.png { add_header Cache-Control "public, max-age=86400"; }

    # Bagdam sayfasinin CSS'i ve gorselleri (2026-08-20)
    location = /styles.css {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --- Eski Ticimax URL'lerinin tamami: GECICI redirect anasayfaya ---
    # 301 DEGIL: yeni site acilinca eski URL -> yeni URL 301 map'i yapilacak.
    location / {
        return 302 /;
    }

    # --- YONLENDIRME (ileride, kullanici onayiyla): tum site -> bagdam.com -------------------
    # Yukaridaki "location = /" ve "location /" bloklarini su tek satirla degistir:
    #   location / { return 301 https://bagdam.com$request_uri; }
    # (ACME location'i ve sertifika kalsin; robots/sitemap da yonlensin — GSC'de "site tasindi" sinyali.)
}
