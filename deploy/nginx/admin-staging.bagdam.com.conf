# =============================================================================
# Bağdam — staging admin vhost: admin-staging.bagdam.com (SPA statik + /api/ → :5011)
#
#   Kopyala: /etc/nginx/sites-available/admin-staging.bagdam.com.conf
#            ln -s /etc/nginx/sites-available/admin-staging.bagdam.com.conf /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#   Ön koşullar: admin.bagdam.com.conf ile aynı + /etc/nginx/.htpasswd-bagdam (staging.bagdam.com.conf'a bakın)
#   Notlar: basic auth ("Bagdam staging") + admin girişi (çift kapı); X-Frame-Options DENY; noindex.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin-staging.bagdam.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin-staging.bagdam.com;

    ssl_certificate     /etc/ssl/bagdam/origin.pem;
    ssl_certificate_key /etc/ssl/bagdam/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bagdam_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bagdam-admin-staging.access.log;
    error_log  /var/log/nginx/bagdam-admin-staging.error.log;

    root /opt/bagdam-staging/apps/admin/dist;
    index index.html;

    client_max_body_size 20M;
    limit_req_status 429;

    auth_basic "Bagdam staging";
    auth_basic_user_file /etc/nginx/.htpasswd-bagdam;

    include snippets/bagdam-security-headers.conf;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"error":"Service Unavailable","message":"Kısa bir bakımdayız, lütfen tekrar deneyin."}';
    }

    # --- API (aynı origin, :5011) -----------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
    }

    location /uploads/ {
        alias /opt/bagdam-staging/apps/api/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Frame-Options DENY always;
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # --- SPA statik ------------------------------------------------------------------------
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/bagdam-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
