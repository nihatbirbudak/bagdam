# =============================================================================
# Bağdam — apex vhost: bagdam.com (+ www → apex 301)  ·  PM2 bagdam-api :5010
#
#   Kopyala: /etc/nginx/sites-available/bagdam.com.conf
#            ln -s /etc/nginx/sites-available/bagdam.com.conf /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#   Ön koşullar:
#     - conf.d/02-bagdam-cache.conf   (proxy_cache_path bagdam_html + gzip)
#     - conf.d/01-rate-limits.conf    (zone=api 10r/s, zone=login 3r/m — sunucuda mevcut)
#     - snippets/bagdam-security-headers.conf, snippets/bagdam-proxy-params.conf
#     - /etc/ssl/bagdam/origin.pem + origin.key  (Cloudflare Origin CA wildcard; yalnız CF proxy arkasında geçerli)
#     - /var/www/maintenance/bagdam/bakim.html   (deploy/maintenance/bakim.html)
#   Notlar:
#     - ADR-0012: apex lansmana kadar coming-soon; bu ayrım uygulama tarafında (SITE_MODE), nginx'te değil.
#     - ADR-0003: anonim HTML 10 s micro-cache; access_token çerezi ve ?siparis= bypass.
#     - Statik dosyalar (assets/styles.css/uploads) doğrudan nginx'ten; immutable olanlar ?v= ile bust edilir
#       (cart.js?v=, styles.css?v= — view'larda sürüm parametresi ZORUNLU, yoksa 1 yıl eski CSS görülür).
#     - Yerel problar: curl -fs http://127.0.0.1:5010/api/v1/health (Origin CA tarayıcıda/curl'de güvenilmez).
# =============================================================================

# --- 80 → https apex -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bagdam.com www.bagdam.com;
    return 301 https://bagdam.com$request_uri;
}

# --- https www → apex ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bagdam.com;

    ssl_certificate     /etc/ssl/bagdam/origin.pem;
    ssl_certificate_key /etc/ssl/bagdam/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://bagdam.com$request_uri;
}

# --- https apex ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bagdam.com;

    ssl_certificate     /etc/ssl/bagdam/origin.pem;
    ssl_certificate_key /etc/ssl/bagdam/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bagdam_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bagdam.access.log;
    error_log  /var/log/nginx/bagdam.error.log;

    client_max_body_size 20M;          # medya yükleme (multer 20 MB, F4)
    limit_req_status 429;              # varsayılan 503 → bakım sayfasına düşmesin

    include snippets/bagdam-security-headers.conf;
    add_header X-Frame-Options SAMEORIGIN always;   # iyzico CF konteyneri bizim sayfamızda iframe; biz framelenmeyiz

    # Bakım / arka uç kapalı: 502-503-504 → bakim.html (durum kodu korunur, Retry-After ile)
    error_page 502 503 504 /bakim.html;
    location = /bakim.html {
        root /var/www/maintenance/bagdam;
        internal;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        include snippets/bagdam-security-headers.conf;
    }

    # API için bakım yanıtı JSON (webhook sağlayıcıları 503 + Retry-After ile yeniden dener)
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"error":"Service Unavailable","message":"Kısa bir bakımdayız, lütfen tekrar deneyin."}';
    }

    # Gizli dosyalar (.env, .git …) asla
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # --- Statik: assets (görseller, fontlar, cart.js) — 1 yıl immutable -------------------------
    location /assets/ {
        alias /opt/bagdam/apps/api/public/assets/;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # styles.css — view'larda styles.css?v=<hash> ile çağrılır (immutable!)
    location = /styles.css {
        alias /opt/bagdam/apps/api/public/styles.css;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # Yüklenen medya (MediaModule; git dışı) — 30 gün
    location /uploads/ {
        alias /opt/bagdam/apps/api/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # --- API ---------------------------------------------------------------------------------
    # Login: 3 istek/dk (ADR-0009; uygulama ayrıca 5 hata → 30 dk kilit)
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;
    }

    # Webhook / ödeme callback / ödeme linki: rate limit DIŞI (iyzico + müşteri dönüşü; F8)
    location ~ ^/api/v1/(webhooks|payments/.+/callback|pay/) {
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;
    }

    # Genel API: 10 r/s + burst 20
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;
    }

    # --- HTML (hbs sayfaları) — anonim 10 s micro-cache ------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5010;
        include snippets/bagdam-proxy-params.conf;

        proxy_cache bagdam_html;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $cookie_access_token $arg_siparis;   # çerezli / sipariş sonucu → önbellekten okuma
        proxy_no_cache     $cookie_access_token $arg_siparis;   # … ve önbelleğe yazma (ayrıca app no-store gönderir)
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_intercept_errors on;                               # 502/503/504 → /bakim.html

        # Bu location'da add_header kullanıldığı için server seviyesindekiler yeniden eklenir
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Frame-Options SAMEORIGIN always;
        include snippets/bagdam-security-headers.conf;
    }
}
