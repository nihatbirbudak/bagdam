# Bağdam — ortak güvenlik header'ları (nginx add_header kalıtım kuralı: bir location kendi add_header'ını
# tanımlarsa server seviyesindekiler kaybolur → böyle location'lar bu dosyayı yeniden include eder).
# Kopyala: /etc/nginx/snippets/bagdam-security-headers.conf
# X-Frame-Options burada YOK: apex SAMEORIGIN (iyzico CF konteyneri), admin DENY — vhost'ta ayrıca eklenir.
# HSTS ayrıca Cloudflare'de de açık (ADR-0012); origin tarafı Full (strict) arkasında zarar vermez.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
