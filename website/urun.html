<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pagetitle">Bağdam — ürün</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <defs>
    <symbol id="ico-seal" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="50" y="57" text-anchor="middle" font-family="Switzer" font-weight="700" font-size="30" fill="currentColor">BA</text>
    </symbol>
  </defs>
</svg>

<header class="nav">
  <div class="nav-inner">
    <a class="wordmark" href="index.html"><img src="assets/logo/logo-horizontal.svg" alt="Bağdam"></a>
    <nav class="nav-links">
      <a href="urunler.html">ürünler</a>
      <a href="gunluk.html">blog</a>
      <a href="toptan.html">toptan</a>
      <a href="nasil-seciyoruz.html">nasıl seçiyoruz</a>
    </nav>
    <div class="nav-icons">
      <a href="uyelik.html" class="nav-icon" aria-label="Üyelik">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </a>
      <a href="sepet.html" class="nav-icon cart" aria-label="Sepet">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h14l-1.4 9.5a2 2 0 0 1-2 1.9H8.4a2 2 0 0 1-2-1.9L5 3H2"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>
        <span class="mono">(0)</span>
      </a>
    </div>
  </div>
</header>

<main>
  <p class="crumb mono"><a href="urunler.html">← ürünlere dön</a></p>

  <section class="product-detail" id="detail">
    <!-- filled by JS -->
  </section>

  <section class="pd-block">
    <h2>senin için <em>önerdiklerimiz</em></h2>
    <div id="reco"></div>
  </section>
</main>

<footer class="site-foot">
  <span class="wordmark small"><img src="assets/logo/logo-vertical.svg" alt="Bağdam"></span>
  <span class="mono">© 2026 — URLA</span>
</footer>

<script src="assets/products.js"></script>
<script src="assets/cart.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id") || "incir";
  const p = PRODUCTS.find((x) => x.id === id) || PRODUCTS[0];
  document.getElementById("pagetitle").textContent = "Bağdam — " + p.name;

  const prefHtml = p.pref
    ? '<div class="pd-pref" data-pref-axis="' + p.pref.label + '">' +
      '<span class="pcard-pref-label mono">' + p.pref.label + "</span>" +
      '<div class="toggle-row">' +
      p.pref.options
        .map(
          (opt, i) =>
            '<button class="toggle' + (i === p.pref.def ? " active" : "") + '" type="button">' + opt + "</button>"
        )
        .join("") +
      "</div></div>"
    : "";

  const repeatPct = p.reviews.repeat;

  const storage = p.fresh
    ? "Yıkayıp tüket. Serin yerde, tercihen buzdolabında sakla."
    : p.tab === "dairy"
      ? "Buzdolabında, +4°C altında sakla."
      : p.tab === "firin"
        ? "Oda sıcaklığında, kese kağıdında 2–3 gün tazeliğini korur; dilimleyip dondurabilirsin."
        : "Açılmadan serin ve kuru yerde, açıldıktan sonra buzdolabında sakla.";
  const allergen = p.tab === "dairy" ? "Süt" : "Yok";

  document.getElementById("detail").innerHTML =
    '<div class="pd-visual"><img src="' + p.img + '" alt="' + p.name + '"><img class="seal" src="assets/logo/logo-icon.svg" alt=""></div>' +
    '<div class="pd-body">' +
      '<p class="pcard-meta mono">' + p.meta + "</p>" +
      "<h1>" + p.name + "</h1>" +
      '<p class="pd-desc">' + p.desc + "</p>" +
      prefHtml +
      '<div class="pd-price-row">' +
        '<span class="price">' + p.price + ' TL <span class="unit">/ ' + p.unit + "</span></span>" +
        '<span class="batch mono">PARTİ ' + p.batch + "</span>" +
      "</div>" +
      (p.fresh
        ? '<a class="cta" href="urunler.html">kutuda dene</a>'
        : '<button class="cta" type="button" data-add-to-cart="' + p.id + '">sepete ekle</button>') +
      '<div class="pd-why">' +
        '<p class="pd-why-label mono">neden bunu seçtik</p>' +
        "<p>" + p.why + "</p>" +
      "</div>" +
      '<div class="pd-batch">' +
        '<p class="demo-label">' + p.harvest + " hasadı — " + p.reviews.buyers + " kişi aldı</p>" +
        '<div class="batch-bar"><div class="batch-fill" style="width:' + repeatPct + '%"></div></div>' +
        '<p class="demo-note mono">%' + repeatPct + " TEKRAR ALIRDI</p>" +
      "</div>" +
      '<div class="pd-usage">' +
        '<div class="pd-usage-row"><span class="pd-usage-label mono">kullanım &amp; saklama</span><span>' + storage + "</span></div>" +
        '<div class="pd-usage-row"><span class="pd-usage-label mono">alerjen</span><span>' + allergen + "</span></div>" +
      "</div>" +
    "</div>";

  // cart.js already wires toggles/add-buttons on DOMContentLoaded, which fires
  // after this synchronous script finishes injecting #detail — no need to
  // call wireToggles/wireAddButtons again here (that would double-bind clicks).
  BahcedenCart.renderRecommended(document.getElementById("reco"), [p.id]);
})();
</script>

</body>
</html>
