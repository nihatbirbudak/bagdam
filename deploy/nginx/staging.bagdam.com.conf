# =============================================================================
# Bağdam — staging vhost: staging.bagdam.com  ·  PM2 bagdam-api-staging :5011  (ADR-0011/0012)
#
#   Kopyala: /etc/nginx/sites-available/staging.bagdam.com.conf
#            ln -s /etc/nginx/sites-available/staging.bagdam.com.conf /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#   Ön koşullar: bagdam.com.conf ile aynı (snippets, conf.d, Origin CA, bakim.html) +
#     /etc/nginx/.htpasswd-bagdam  →  printf 'bagdam:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/.htpasswd-bagdam
#                                    chown root:www-data /etc/nginx/.htpasswd-bagdam && chmod 640 …
#   Notlar:
#     - Tüm site basic auth ("Bagdam staging") + X-Robots-Tag noindex; tam site burada (SITE_MODE=full).
#     - auth_basic OFF: webhook / ödeme callback / ödeme linki (iyzico sandbox ve müşteri dönüşü) — ADR-0011.
#     - Basic auth Authorization başlığı API'ye iletilir; API Bearer dışındaki şemaları yok sayar.
#     - Cache aynı bagdam_html alanı; anahtar $host içerdiği için prod ile karışmaz.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name staging.bagdam.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.bagdam.com;

    ssl_certificate     /etc/ssl/bagdam/origin.pem;
    ssl_certificate_key /etc/ssl/bagdam/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bagdam_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bagdam-staging.access.log;
    error_log  /var/log/nginx/bagdam-staging.error.log;

    client_max_body_size 20M;
    limit_req_status 429;

    # Staging: parola + arama motoru dışı
    auth_basic "Bagdam staging";
    auth_basic_user_file /etc/nginx/.htpasswd-bagdam;

    include snippets/bagdam-security-headers.conf;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 502 503 504 /bakim.html;
    location = /bakim.html {
        root /var/www/maintenance/bagdam;
        internal;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        include snippets/bagdam-security-headers.conf;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"error":"Service Unavailable","message":"Kısa bir bakımdayız, lütfen tekrar deneyin."}';
    }

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # robots.txt: basic auth arkasında kalmasın (Disallow gönderir; noindex header'ı zaten var)
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- Statik -----------------------------------------------------------------------------
    location /assets/ {
        alias /opt/bagdam-staging/apps/api/public/assets/;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    location = /styles.css {
        alias /opt/bagdam-staging/apps/api/public/styles.css;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    location /uploads/ {
        alias /opt/bagdam-staging/apps/api/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/bagdam-security-headers.conf;
        access_log off;
    }

    # --- API ---------------------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
    }

    # Webhook / callback / ödeme linki: basic auth KAPALI, rate limit dışı
    location ~ ^/api/v1/(webhooks|payments/.+/callback|pay/) {
        auth_basic off;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 @api_unavailable;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
    }

    # Ödeme linki web sayfası (e-postadan gelen müşteri; F8 GET /pay/:linkToken) — basic auth KAPALI
    location ^~ /pay/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;
        proxy_intercept_errors on;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/bagdam-security-headers.conf;
    }

    # --- HTML — prod ile aynı micro-cache davranışı (Playwright parite) -----------------------
    location / {
        proxy_pass http://127.0.0.1:5011;
        include snippets/bagdam-proxy-params.conf;

        proxy_cache bagdam_html;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $cookie_access_token $arg_siparis;
        proxy_no_cache     $cookie_access_token $arg_siparis;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_intercept_errors on;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/bagdam-security-headers.conf;
    }
}
