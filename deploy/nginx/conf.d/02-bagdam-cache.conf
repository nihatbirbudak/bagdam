# =============================================================================
# Bağdam — nginx http seviyesi: HTML micro-cache alanı + gzip türleri
#
#   Kopyala: /etc/nginx/conf.d/02-bagdam-cache.conf
#   (00-cloudflare-realip.conf ve 01-rate-limits.conf ile aynı dizin; alfabetik sırayla yüklenir)
#   Ön koşul: mkdir -p /var/cache/nginx/bagdam && chown www-data:www-data /var/cache/nginx/bagdam
#   (nginx ara dizinleri kendisi oluşturmaz; /var/cache/nginx Ubuntu paketinde yoktur)
#
#   bagdam_html: anonim HTML sayfaları 10 s önbellek (ADR-0003). Çerezli (access_token) ve ?siparis=
#   istekleri vhost'ta bypass edilir; uygulama çerezli yanıtı zaten "Cache-Control: private, no-store"
#   gönderir. 200 MB üst sınır, 10 dk kullanılmayan girdiler silinir.
# =============================================================================
proxy_cache_path /var/cache/nginx/bagdam levels=1:2 keys_zone=bagdam_html:10m max_size=200m inactive=10m use_temp_path=off;

# gzip: /etc/nginx/nginx.conf'ta "gzip on;" açık, gzip_types yorumlu → http context'te tek yer burası.
# (woff2 zaten sıkıştırılmış → listede yok; Cloudflare ayrıca brotli uygular.)
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/ld+json
    application/xml
    application/xml+rss
    application/rss+xml
    image/svg+xml
    font/ttf
    application/vnd.ms-fontobject;
