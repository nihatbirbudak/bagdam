# Bağdam — API/HTML proxy parametreleri (proxy_pass satırından SONRA include edilir)
# Kopyala: /etc/nginx/snippets/bagdam-proxy-params.conf
# Gerçek istemci IP'si conf.d/00-cloudflare-realip.conf ile $remote_addr'a yazılır (CF-Connecting-IP).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
