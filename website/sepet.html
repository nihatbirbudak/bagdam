<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağdam — sepet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="wordmark" href="index.html"><img src="assets/logo/logo-horizontal.svg" alt="Bağdam"></a>
    <nav class="nav-links">
      <a href="urunler.html">ürünler</a>
      <a href="gunluk.html">blog</a>
      <a href="toptan.html">toptan</a>
      <a href="nasil-seciyoruz.html">nasıl seçiyoruz</a>
    </nav>
    <div class="nav-icons">
      <a href="uyelik.html" class="nav-icon" aria-label="Üyelik">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </a>
      <a href="sepet.html" class="nav-icon cart on" aria-label="Sepet">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h14l-1.4 9.5a2 2 0 0 1-2 1.9H8.4a2 2 0 0 1-2-1.9L5 3H2"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>
        <span class="mono">(0)</span>
      </a>
    </div>
  </div>
</header>

<main>
  <section class="shop-hero">
    <span class="eyebrow">Sepetin</span>
    <h1>almadan <em>önce</em> son bir bak</h1>
  </section>

  <section class="cart-wrap" id="cartWrap"><!-- filled by JS --></section>
</main>

<footer class="site-foot">
  <span class="wordmark small"><img src="assets/logo/logo-vertical.svg" alt="Bağdam"></span>
  <span class="mono">© 2026 — URLA</span>
</footer>

<script src="assets/products.js"></script>
<script src="assets/cart.js"></script>
<script>
(function () {
  function money(n) { return n.toLocaleString("tr-TR"); }

  function render() {
    const items = BahcedenCart.getCart();
    const sub = BahcedenCart.getSub();
    const tier = BahcedenCart.subTier();
    const wrap = document.getElementById("cartWrap");

    if (!tier && items.length === 0) {
      wrap.innerHTML =
        '<p class="cart-empty mono">henüz bir aboneliğin yok.</p>' +
        '<a class="btn" href="urunler.html">aboneliği başlat</a>';
      return;
    }

    let subtotal = 0;
    let subBlock = "";
    if (tier) {
      subtotal += sub.skipThisWeek ? 0 : tier.price;
      const itemNames = sub.items
        .map((id) => { const p = PRODUCTS.find((x) => x.id === id); return p ? p.name : ""; })
        .filter(Boolean)
        .join(", ");
      subBlock =
        '<div class="cart-row sub-row">' +
          '<div class="cart-row-info">' +
            "<h3>" + tier.label + " — " + tier.count + " ürün</h3>" +
            '<p class="pcard-meta mono">' + itemNames + "</p>" +
            (sub.skipThisWeek
              ? '<p class="sub-skip-note mono">BU HAFTA ATLANDI</p>'
              : '<p class="sub-skip-note mono">HER HAFTA OTOMATİK GELİR</p>') +
            '<div class="qty-row"><a class="cart-remove mono" href="kutu.html?tier=' + tier.id + '">kutuyu düzenle</a></div>' +
          "</div>" +
          '<span class="price mono">' + (sub.skipThisWeek ? "0 TL" : money(tier.price) + " TL") + "</span>" +
        "</div>";
    }

    const rows = items
      .map((item, i) => {
        const p = PRODUCTS.find((x) => x.id === item.id);
        if (!p) return "";
        const lineTotal = p.price * item.qty;
        subtotal += lineTotal;
        return (
          '<div class="cart-row">' +
            '<img src="' + p.img + '" alt="' + p.name + '">' +
            '<div class="cart-row-info">' +
              "<h3>" + p.name + "</h3>" +
              '<p class="pcard-meta mono">' + (item.pref ? item.pref : p.meta) + "</p>" +
              '<div class="qty-row">' +
                '<button class="qty-btn" data-idx="' + i + '" data-dir="-1" type="button">–</button>' +
                '<span class="mono">' + item.qty + "</span>" +
                '<button class="qty-btn" data-idx="' + i + '" data-dir="1" type="button">+</button>' +
                '<button class="cart-remove mono" data-idx="' + i + '" type="button">kaldır</button>' +
              "</div>" +
            "</div>" +
            '<span class="price mono">' + money(lineTotal) + " TL</span>" +
          "</div>"
        );
      })
      .join("");

    wrap.innerHTML =
      '<div class="cart-rows">' + subBlock + rows + "</div>" +
      '<div class="cart-summary">' +
        '<div class="cart-total"><span>Bu haftaki toplam</span><span class="mono">' + money(subtotal) + " TL</span></div>" +
        '<p class="cart-note">Teslimat: Perşembe toplanır, Cuma kapında.</p>' +
        '<button class="cta wide" type="button" disabled title="Bu bir tasarım prototipi — ödeme altyapısı henüz bağlı değil">ödemeye geç</button>' +
        (tier ? '<p class="cancel-note"><a href="#" id="cancelSub">aboneliği iptal et</a></p>' : "") +
      "</div>";

    const cancelSub = document.getElementById("cancelSub");
    if (cancelSub) {
      cancelSub.addEventListener("click", (e) => {
        e.preventDefault();
        BahcedenCart.subCancel();
        render();
      });
    }

    wrap.querySelectorAll(".qty-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-idx"), 10);
        const dir = parseInt(btn.getAttribute("data-dir"), 10);
        const items = BahcedenCart.getCart();
        BahcedenCart.setQty(idx, items[idx].qty + dir);
        render();
      });
    });
    wrap.querySelectorAll(".cart-remove").forEach((btn) => {
      btn.addEventListener("click", () => {
        BahcedenCart.remove(parseInt(btn.getAttribute("data-idx"), 10));
        render();
      });
    });
  }

  render();
})();
</script>

</body>
</html>
